<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curb occupancy map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --hair: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --critical: #d03b3b;
  --chip: #f0efec; --track: #e8e7e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --hair: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --chip: #2c2c2a; --track: #2c2c2a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --hair: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --chip: #2c2c2a; --track: #2c2c2a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--ink);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: grid; grid-template-columns: 390px 1fr; }
#side { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border);
        padding: 16px 16px 32px; }
#map { height: 100vh; }
.top { display: flex; gap: 10px; align-items: start; }
.top > div:first-child { flex: 1; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 2px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
     margin: 20px 0 8px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 12px; }
.warn { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: var(--chip);
        color: var(--ink-2); font-size: 12px; }
.seg { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.seg button { flex: 1; border: 0; padding: 7px 0; background: transparent; color: var(--ink-2);
              font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.small { margin: 0; border-radius: 6px; }
.seg.small button { padding: 2px 8px; font-size: 12px; font-weight: 600; }
select { width: 100%; padding: 6px; font: inherit; color: var(--ink);
         background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
label.ck { display: flex; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; }
.hero { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
.hero .big { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.hero .what { color: var(--ink-2); font-size: 13px; }
.legend { display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; align-items: center; font-size: 13px; }
.legend svg { display: block; }
table.blocks { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.blocks td, table.blocks th { padding: 3px 4px; border-top: 1px solid var(--hair); vertical-align: middle; }
table.blocks th { font-weight: 600; color: var(--muted); text-align: right; border-top: 0; font-size: 11px; }
table.blocks th:first-child { text-align: left; }
table.blocks tbody tr { cursor: pointer; }
table.blocks tbody tr:hover td { background: var(--chip); }
table.blocks td.n { text-align: right; white-space: nowrap; color: var(--ink-2); }
table.blocks td.p { text-align: right; font-weight: 600; width: 44px; white-space: nowrap; }
table.blocks tfoot td { font-weight: 600; }
table.blocks tfoot tr:first-child td { border-top: 1px solid var(--muted); }
table.blocks td.src { color: var(--muted); font-size: 11px; }
.bar { width: 64px; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
/* class distribution: 100 % stacked bars, 2px surface gap between segments, 4px outer ends */
.dist .row { margin: 10px 0 12px; }
.dist .lab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; font-size: 12px; }
.dist .lab .n { color: var(--muted); white-space: nowrap; }
.dist .stk { display: flex; gap: 2px; height: 18px; margin-top: 4px; }
.dist .stk i { display: block; height: 100%; font-style: normal; font-size: 10px; line-height: 18px;
               text-align: center; font-variant-numeric: tabular-nums; cursor: default; }
.dist .stk i:first-child { border-radius: 4px 0 0 4px; }
.dist .stk i:last-child { border-radius: 0 4px 4px 0; }
.dist .stk i:only-child { border-radius: 4px; }
.dist .key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); }
.dist .key b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.dist .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
.dl { list-style: none; padding: 0; margin: 0; }
.dl li { padding: 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
.dl li:hover { background: var(--chip); }
.dl .id { font-weight: 600; }
.dl .id::before { content: "!"; display: inline-grid; place-items: center; width: 16px; height: 16px;
                  border-radius: 50%; background: var(--critical); color: #fff; font-size: 11px;
                  margin-right: 6px; vertical-align: 1px; }
.dl .t { color: var(--ink-2); font-size: 12px; }
.method { font-size: 12px; color: var(--ink-2); }
.method p { margin: 0 0 6px; }
.attr { margin-top: 24px; color: var(--muted); font-size: 11px; }
dialog { width: min(1100px, 96vw); max-height: 92vh; border: 1px solid var(--border);
         border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { position: sticky; top: 0; background: var(--surface); padding: 14px 18px;
                border-bottom: 1px solid var(--hair); display: flex; gap: 12px; align-items: start; }
dialog header h3 { margin: 0; font-size: 16px; flex: 1; }
dialog .body { padding: 14px 18px 20px; }
dialog table { border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
dialog td { padding: 3px 14px 3px 0; vertical-align: top; }
dialog td:first-child { color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--chip); color: var(--ink); border-radius: 6px;
       padding: 5px 10px; font: inherit; cursor: pointer; text-decoration: none; font-size: 13px; }
.imgs figure { margin: 0 0 14px; }
.imgs .scroll { overflow-x: auto; border: 1px solid var(--hair); border-radius: 6px; }
.imgs img { display: block; max-width: none; }
.imgs img.frame { max-width: 100%; }
.imgs figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.leaflet-tooltip.occ { background: #fcfcfb; color: #0b0b0b; border: 1px solid rgba(11,11,11,.15);
                       box-shadow: none; padding: 1px 5px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.leaflet-tooltip.occ.est { color: #52514e; font-weight: 500; font-style: italic; border-style: dashed; }
.leaflet-tooltip.occ::before { display: none; }
.leaflet-popup-content { font-size: 13px; }
.leaflet-popup-content b { font-weight: 600; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  #map { height: 55vh; order: -1; }
  #side { border-right: 0; border-top: 1px solid var(--border); padding: 12px 16px 24px; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="top">
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <div class="seg small" id="langbox" role="group" aria-label="Language / Langue"></div>
  </div>
  <div id="warn"></div>

  <div id="viewbox" style="margin-top:14px"></div>
  <select id="pass"></select>
  <div class="hero"><span class="big" id="hero"></span><span class="what" id="herowhat"></span></div>

  <h2 id="h-legend"></h2>
  <div class="legend" id="legend"></div>

  <h2 id="h-layers"></h2>
  <div id="toggles"></div>
  <div id="bases"></div>

  <h2 id="h-dist"></h2>
  <div class="dist" id="dist"></div>

  <h2 id="h-table"></h2>
  <table class="blocks" id="blocks"></table>

  <div id="checkbox"></div>

  <h2 id="h-method"></h2>
  <div class="method" id="method"></div>

  <div class="attr"><span id="attr"></span> <span id="gen"></span></div>
</aside>
<div id="map"></div>
<dialog id="card"></dialog>

<script>
const D = /*__DATA__*/null;
const M = D.meta, LY = D.layers, REVIEW = M.mode === "review", G = M.guideline;
const CAP = M.capacity || null;
const CAPF = (LY.capacity && LY.capacity.features) || [];

// ---- language: ?lang= > the viewer's last choice > browser languages > English
const LANGS = ["en", "fr"];
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  const s = store("pc-lang");
  if (LANGS.includes(s)) return s;
  for (const l of navigator.languages || [navigator.language || ""]) {
    const k = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(k)) return k;
  }
  return "en";
})();
const LOC = () => LANG === "fr" ? "fr-CA" : "en-CA";

// UI strings; functions take the values they interpolate. Review-only text stays English.
const STR = {
  en: {
    subtitle: f => `On-street parking occupancy and capacity, ${f}`,
    subtitle_street: f => `On-street parking occupancy, ${f}`,
    review: "Review map (private: contains vehicle imagery)",
    frame: (wk, a, b) => `${wk ? "weekday " : ""}evenings, ${a}–${b}`,
    frame_window: (a, b) => `evenings ${a}–${b} h`,
    generated: d => `Generated ${d}.`,
    provisional: (n, k) => `Provisional: ${n} of the ${k} evenings the method asks for.`,
    no_driveways: "Driveways not deducted yet: capacity is overestimated, occupancy underestimated.",
    view_cap: "Capacity", view_occ: "Occupancy", view_reg: "Regulation",
    pass: "Pass", legend: "Legend", layers: "Layers", stretches: "Stretches", streets: "Streets", method: "Method",
    tog_cars: z => `Parked vehicles (zoom ${z}+)`, tog_labels_occ: "Stretch occupancy labels",
    tog_labels_cap: "Block capacity labels",
    base_esri: "Street map (Esri)", base_sat: "Aerial imagery (Esri)", base_osm_needs: " · OSM needs `curb-occupancy serve`",
    mean_of: n => `Mean of the ${n}`,
    avg_of: parts => `Time-weighted average (${parts})`,
    slot_of: (lab, h, u) => `${lab}, ${h}: mean of the ${u}`,
    avg_note: one => one ? ` (${one} only)` : " (time-weighted)",
    one_slot_tip: lab => `Recorded in one slot only (${lab}): it stands for the whole window`,
    one_slot_note: k => `† ${k} ${k > 1 ? "stretches" : "stretch"} recorded in one slot only: that slot stands for the whole window.`,
    m_slots: (o) => `<p><b>Time slots</b>: the passes fall in ${o.n} slots, ${o.list}. A slot's figure is the mean over
      its evenings (the passes of one evening averaged first). The <b>time-weighted average</b> weighs each slot by the hours it
      stands for (${o.w}): occupied space-hours over available space-hours, so the capacity of each slot (rules change with
      the hour) counts in proportion. A stretch recorded in one slot only takes that slot's figure (marked †).</p>`,
    daylight: (w, r) => `the method needs daylight, so the passes cover the start of the ${w} window${r ? " used in the reference study" : ""}`,
    slots_light: (w, r) => `early passes at dusk, late passes after dark, across the ${w} window${r ? " used in the reference study" : ""}`,
    evening: k => k > 1 ? "evenings" : "evening", pass_n: k => k > 1 ? "passes" : "pass",
    evening_passes: k => `evening ${k > 1 ? "passes" : "pass"}`,
    n_streets: n => `${n} streets`,
    dist: "How often is the curb full?",
    dist_n: (n, s, d) => `${n} stretch-evenings · ${s} stretches · ${d} evenings`,
    dist_seg: (lab, p, k, n, w) => `${lab}: ${p}${w ? " (time-weighted)" : ""} · ${k} of ${n} stretch-evenings`,
    dist_note: ss => `Each bar splits the street stretches (sections of about ${ss} spaces) by how full they were on each
      evening of the survey.`,
    dist_example: (lab, cls, under, p, k, n) => ` For example, ${lab}: a stretch was ${cls} (under ${under}) on ${p} of
      evenings (${k} of ${n} stretch-evenings).`,
    dist_weighted: (n, eq) => ` Time-weighted bars combine early and late evening: each stretch counts once, with its
      ${n === 2 ? "two " : ""}time slots ${eq ? "weighing equally" : "weighted by the hours they cover"}.`,
    or: "or",
    cls: {very_low: "Very low", low: "Low", optimal: "Optimal", full: "Full"},
    nopark: "Not parkable (corner, no stopping, driveway, hydrant…)",
    nocap: "Parkable, stretch not covered by this pass",
    parked_vehicle: "Parked vehicle",
    parked_overlay: u => `Parked vehicle (overlay of the ${u}: darker = parked in more of them)`,
    site_check: "Site check",
    kind: {legal: "Legal", limited: "Time-limited", permit: "Permit zone", no_stopping: "No stopping",
           no_parking: "No parking", reserved: "Reserved (disabled, drop-off…)", hydrant: "Hydrant clearance",
           driveway: "Driveway", intersection: "Intersection"},
    not_covered: "Not covered by this pass, or no parkable curb",
    stretch_text: (n, c) => `${n} parked / ${c} spaces`,
    mean_note: u => ` (mean of ${u})`,
    not_legal: k => ` · ${k} in a non-parkable spot (counted)`,
    occ_what: (area, n, c) => `${area ? "area" : "street"} occupancy<br>${n} parked / ${c} spaces`,
    no_pass: "no pass covers the street",
    side: {north: "north side", east: "east side", south: "south side", west: "west side"},
    // capacity view
    cap_measured: "Measured: parkable curb of a block recorded by bike",
    cap_nopark: "Not parkable (measured blocks: corner, no stopping, driveway, hydrant…)",
    cap_est: r => `Estimated: block not recorded, length × ${r} spaces per km`,
    cap_label: "Number of spaces in the block (≈ = estimated)",
    cap_what: (lv, lo, hi, m, fm, e, fe) =>
      `spaces in the area (${lv} interval ${lo}–${hi})<br>${m} measured on ${fm} block faces · ${e} estimated on ${fe}`,
    cap_tip_m: (n, l) => `<b>${n} spaces</b> (measured) · ${l} m`,
    cap_tip_e: (n, l) => `<b>≈ ${n} spaces</b> (estimated) · ${l} m`,
    cap_tip_r: r => `, of which ${r} m under signed restrictions (school, drop-off, no parking…), left out`,
    m_restr: (n, r) => ` On ${n} estimated block faces the city's signs show a large restriction in force at that time
      (school zone, sports-centre drop-off, long no-parking zone: ${r} m in all); that length is removed before applying the rate.`,
    cap_cols: ["Street", "", "curb", "spaces"],
    src_measured: "measured", src_estimated: "estimated",
    sub_m: "Measured", sub_e: "Estimated", total: "Total",
    face_name: (st, side, a, b) => `${st}, ${side}: ${a} – ${b}`,
    stretch_name: (st, sides, a, b) => `${st} (${sides}): ${a} – ${b}`,
    // method
    m_cap: (o) => `<p><b>Capacity</b> is counted per block face (one side of the street between two cross streets).
      <b>Measured</b> blocks were recorded by bike: parkable curb length after removing intersection approaches,
      no-stopping and reserved zones in force at the time of the passes, hydrant clearances and driveways;
      each parkable piece between two of these holds floor(length / ${o.stall} m) cars.
      <b>Estimated</b> blocks were not recorded: block length on OpenStreetMap (intersection to intersection)
      × ${o.rate} spaces per km of curb (one space per ${o.mps} m), the rate measured on ${o.n} side-street block faces
      (${o.sp} spaces over ${o.len} m). An estimate ignores the block's own driveways, hydrants and ordinary signs: the measured faces
      vary by about ±${o.cv} (one standard deviation) around this rate. The area total comes with a ${o.lv} prediction interval
      (${o.lo}–${o.hi}), which assumes the measured faces are representative of the others; they were chosen, not drawn at random.
      ${o.restr}${o.note}</p>`,
    m_occ: (o) => `<p><b>Occupancy</b> = parked vehicles / capacity, per stretch of about ${o.ss} spaces
      (consecutive blocks between cross streets, ${o.area ? "the side recorded on each street" : "both sides"}; a single short block swings between 0 and 100 %
      with one car), adapted from the method of ${o.ref}: capacity = parkable curb length / ${o.stall} m per space,
      after removing intersection approaches, no-stopping and reserved zones in force at the time of the pass,
      hydrant clearances and driveways. Every parked vehicle counts, including those in non-parkable spots.</p>`,
    m_counts: (o) => `<p><b>Counts</b>: vehicles detected in a continuous side-view image of the curb, built from video
      recorded while cycling ${o.area ? `${o.nst} streets` : "the street"} (${o.np} ${o.np > 1 ? "passes" : "pass"}${o.ne ? ` on ${o.ne} ${o.ne > 1 ? "evenings" : "evening"}` : ""},
      ${o.frame}; ${t(o.slots ? "slots_light" : "daylight", `${o.w0}–${o.w1} h`, o.hasref)}).</p>`,
    m_prior: (o) => `<p><b>Regulations</b>: city open data (signage), read with site knowledge: parking is allowed
      except near intersections (no-stopping signs within ${o.corner} m of a cross street, sign to corner)
      and listed exceptions${o.keep}; reserved spaces as signed. ${o.ni} mid-block sign record${o.ni === 1 ? "" : "s"} not matching the
      street were set aside for a site check.</p>`,
    m_regs: (o) => `<p><b>Regulations</b>: city open data (parking signage); ${o.how}.${o.fix}</p>`,
    regs_conv: (w) => `every panel applied as signed (Quebec arrow convention) on ${w}`,
    regs_inf: (w) => `on ${w}, the direction of each zone inferred from the panels of its block face (the data does not record which way a panel faces)`,
    regs_fix: (p) => ` Records corrected after checks against the imagery or on site: ${p} (listed with the study data).`,
    regs_arrows: (n) => `${n} arrow${n === 1 ? "" : "s"} recorded mirrored`,
    regs_dropped: (n) => `${n} panel${n === 1 ? "" : "s"} dropped (misplaced or gone)`,
    regs_moved: (n) => `${n} pole${n === 1 ? "" : "s"} moved to where the imagery shows ${n === 1 ? "it" : "them"}`,
    n_streets: (n) => `${n} streets`, other_streets: (n) => `the other ${n} streets`, and: "and",
    m_spaces: (o) => `<p><b>Spaces</b> are counted per parkable stretch (a stretch between two driveways holds
      floor(length / ${o.stall}) cars). Stretch figures are capped at 100 % on the map; vehicles beyond
      the capacity (in front of driveways, at corners) still count in the street total.</p>`,
    m_classes: (o) => `<p><b>Classes</b>: ${o.cls}${o.hasref ? `, as in the reference study
      (about ${o.opt} is generally considered optimal, under ${o.low} low)` : ""}.</p>`,
    attr: (src) => `Street geometry and map data &copy; OpenStreetMap contributors (ODbL). ${src}
      Esri basemaps: see map credits.`,
  },
  fr: {
    subtitle: f => `Occupation et capacité du stationnement sur rue, ${f}`,
    subtitle_street: f => `Occupation du stationnement sur rue, ${f}`,
    review: "Carte de révision (privée : contient des images de véhicules)",
    frame: (wk, a, b) => `${wk ? "soirs de semaine" : "soirs"}, ${a} – ${b}`,
    frame_window: (a, b) => `soirs, ${a} h – ${b} h`,
    generated: d => `Généré le ${d}.`,
    provisional: (n, k) => `Provisoire : ${n} des ${k} soirs demandés par la méthode.`,
    no_driveways: "Entrées charretières pas encore déduites : capacité surestimée, occupation sous-estimée.",
    view_cap: "Capacité", view_occ: "Occupation", view_reg: "Réglementation",
    pass: "Passage", legend: "Légende", layers: "Couches", stretches: "Sections", streets: "Rues", method: "Méthode",
    tog_cars: z => `Véhicules stationnés (zoom ${z}+)`, tog_labels_occ: "Taux d’occupation des sections",
    tog_labels_cap: "Nombre de places par tronçon",
    base_esri: "Plan des rues (Esri)", base_sat: "Imagerie aérienne (Esri)", base_osm_needs: " · OSM exige `curb-occupancy serve`",
    mean_of: n => `Moyenne des ${n}`,
    avg_of: parts => `Moyenne pondérée par la durée (${parts})`,
    slot_of: (lab, h, u) => `${lab}, ${h} : moyenne des ${u}`,
    avg_note: one => one ? ` (${one} seulement)` : " (pondérée par la durée)",
    one_slot_tip: lab => `Enregistrée dans une seule plage (${lab}) : elle représente toute la période`,
    one_slot_note: k => `† ${k} ${k > 1 ? "sections enregistrées" : "section enregistrée"} dans une seule plage : cette plage représente toute la période.`,
    m_slots: (o) => `<p><b>Plages horaires</b> : les passages se répartissent en ${o.n} plages, ${o.list}. Le taux d’une plage est
      la moyenne de ses soirs (les passages d’un même soir d’abord moyennés). La <b>moyenne pondérée par la durée</b> pondère chaque
      plage par les heures qu’elle représente (${o.w}) : places-heures occupées sur places-heures disponibles, de sorte que la
      capacité de chaque plage (la réglementation change selon l’heure) compte en proportion. Une section enregistrée dans une
      seule plage prend le taux de cette plage (marquée †).</p>`,
    daylight: (w, r) => `la méthode exige la lumière du jour, les passages couvrent donc le début de la plage ${w}${r ? " de l’étude de référence" : ""}`,
    slots_light: (w, r) => `passages hâtifs au crépuscule, passages tardifs à la nuit, sur la plage ${w}${r ? " de l’étude de référence" : ""}`,
    evening: k => k > 1 ? "soirs" : "soir", pass_n: k => k > 1 ? "passages" : "passage",
    evening_passes: k => `${k > 1 ? "passages" : "passage"} en soirée`,
    n_streets: n => `${n} rues`,
    dist: "La bordure est-elle souvent pleine ?",
    dist_n: (n, s, d) => `${n} sections-soirs · ${s} sections · ${d} soirs`,
    dist_seg: (lab, p, k, n, w) => `${lab} : ${p}${w ? " (pondéré)" : ""} · ${k} sur ${n} sections-soirs`,

const t = (k, ...a) => { const v = STR[LANG][k] ?? STR.en[k]; return typeof v === "function" ? v(...a) : v; };

// numbers, dates and names in the page's language
const nf = (v, d = 1) => v == null ? "–" : new Intl.NumberFormat(LOC(), {maximumFractionDigits: d}).format(v);

const asDate = s => new Date(s.length <= 10 ? s + "T12:00" : s);

// Occupancy classes: ordinal one-hue ramp (blue 250/400/550/700, validated as an ordinal ramp

const RAMP = ["#86b6ef", "#3987e5", "#1c5cab", "#0d366b"];
const CLASSES = G.classes.map(([hi, key, label], i) => {

const clsLabel = c => `${t("cls")[c.key] || c.en} (${c.hi == null ? `≥ ${pct(c.lo)}` : c.lo ? `${pct(c.lo, false)}–${pct(c.hi)}` : `< ${pct(c.hi)}`})`;
const NOPARK = {color: "#898781", dash: "1 6"};
const NOCAP = {color: "#b5b3aa", dash: "6 6"};
// capacity view: measured = solid, estimated = lighter + dashed (same hue: one quantity)
const CAP_M = {color: "#1c5cab", weight: 6};
const CAP_E = {color: "#3987e5", dash: "7 6", weight: 5, opacity: .85};
// Regulation view (review): curb status kinds, three hues + neutrals; dash = secondary cue.
const KIND = {
  legal:        {color: "#2a78d6"},
  limited:      {color: "#1baf7a"},
  permit:       {color: "#1baf7a", dash: "7 6"},
  no_stopping:  {color: "#eb6834"},
  no_parking:   {color: "#eb6834", dash: "10 6"},
  reserved:     {color: "#eb6834", dash: "1 7"},

// stretch figures are shown capped at 100 %: more vehicles than spaces means vehicles in

// parked / spaces counts are shown next to it and every vehicle counts in the street total
const cap1 = v => v == null ? v : Math.min(1, v);
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function occClass(o) { return o == null ? null : CLASSES.find(c => c.hi == null || o < c.hi); }
const passById = Object.fromEntries(M.passes.map(p => [p.id, p]));
const passLabel = id => { const p = passById[id]; return p ? `${p.street ?? p.id} ${fmtDay(p.when)} ${fmtTime(p.when.slice(11, 16))}` : id; };
const EV = M.evening_passes || [];
// area map: the selector lists evenings (one recording, several street passes each)
const EVS = M.evenings || null;
const units = k => `${nf(k)} ${EVS ? t("evening", k) : t("pass_n", k)}`;
const nEV = EVS ? EVS.filter(e => e.passes.some(id => EV.includes(id))).length : EV.length;
// slot views (guideline.slots, passes in two or more slots): time-weighted average + one per slot
const AGG = (M.aggregates || []).filter(a => a.kind === "slot").length >= 2 ? M.aggregates : [];
const aggById = Object.fromEntries(AGG.map(a => [a.id, a]));
const SLOT = Object.fromEntries((G.slots || []).map(s => [s.key, s]));
const slotLabel = k => { const s = SLOT[k] || {}; return title(s.label) || k; };
const hrs = h => LANG === "fr" ? `${h[0]} h – ${h[1]} h` : `${h[0]}–${h[1]} h`;
const isView = id => id === "evening" || !!aggById[id];
function aggLabel(a) {

const oneSlot = s => s && s.view === "avg" && s.slots && !s.slots.includes("+") ? slotLabel(s.slots) : null;
function eveningLabel(e) {

}
function stretchName(p) {

}
const faceName = p => t("face_name", p.street, sideName(p.side), p.from, p.to);
// pass ids of the selection: 'evening' = the guideline-window passes, 'ev:<date>' = one evening
function selIds() {
  if (pass === "evening") return EV;

  return e ? e.passes : [pass];

function frame() {
  const ws = M.passes.filter(p => EV.includes(p.id)).map(p => p.when);
  if (!ws.length) return t("frame_window", G.window[0], G.window[1]);
  const wk = ws.every(w => [1, 2, 3, 4, 5].includes(asDate(w.slice(0, 10)).getDay()));

const map = L.map("map", {zoomSnap: 1, maxZoom: 21}).setView(M.center, 16);

const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

const SERVED = location.protocol.startsWith("http");
const BASES = [
  ...(SERVED ? [["osm", () => "OpenStreetMap", L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",

  ["sat", () => t("base_sat"), L.tileLayer(`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`,

  const h = d[d.length - 1] / 2;
  let i = 1;
  while (i < c.length - 1 && d[i] < h) i++;
  const u = d[i] > d[i - 1] ? (h - d[i - 1]) / (d[i] - d[i - 1]) : 0;
  return [c[i - 1][1] + u * (c[i][1] - c[i - 1][1]), c[i - 1][0] + u * (c[i][0] - c[i - 1][0])];

const POINT_ZOOM = 17;  // cars, zones, poles and hydrants bury the curb lines below this zoom

let view = "occ";  // occupancy first (user, 2026-11-15); capacity is the second view
let pass = AGG.length ? "avg" : EV.length ? "evening" : (EVS ? EVS[0]?.id : M.passes[0]?.id) ?? null;
const groups = {curb: L.layerGroup(), labels: L.layerGroup(), zones: L.layerGroup(), signs: L.layerGroup(),
                hydrants: L.layerGroup(), cars: L.layerGroup(), tracks: L.layerGroup(), checks: L.layerGroup()};

// stretch numbers for the selected pass ('evening' = mean over the guideline-window passes)
function stretchStats(p) {

  }

    const e = p.evening;

  }
  const qs = selIds().map(id => p.per_pass?.[id]).filter(q => q && q.covered && q.capacity);

const FACE = Object.fromEntries(CAPF.map(f => [f.properties.face, f.properties]));

function drawCurb() {

    for (const f of LY.status.features) {  // measured blocks: their curb as seen
      const p = f.properties, q = FACE[p.face];
      if (!q) continue;
      const g = cased(f, p.parkable ? CAP_M : {...NOPARK, weight: 3});

      groups.curb.addLayer(g);

      if (f.properties.kind !== "estimated") continue;

      : `<b>${s ? pct(cap1(s.occ)) : "–"}</b> · ${esc(stretchText(s))}` +

    groups.curb.addLayer(g);
  }
}

// the two faces of a block sit ~10 m apart: push each label away from its partner
function capLabelOffsets() {
  const key = p => [p.street, ...[p.from, p.to].sort()].join("|"), byKey = {}, off = {};
  for (const f of CAPF) (byKey[key(f.properties)] = byKey[key(f.properties)] || []).push(f);
  for (const fs of Object.values(byKey)) {
    if (fs.length !== 2) continue;
    const [a, b] = fs.map(f => midOf(f.geometry.coordinates));
    const k = Math.cos(a[0] * Math.PI / 180);
    let dx = (a[1] - b[1]) * k, dy = -(a[0] - b[0]);  // screen: x east, y south
    const n = Math.hypot(dx, dy) || 1;
    dx = 13 * dx / n; dy = 13 * dy / n;
    off[fs[0].properties.face] = [dx, dy];
    off[fs[1].properties.face] = [-dx, -dy];
  }
  return off;
}
const CAP_OFF = capLabelOffsets();

function drawLabels() {
  groups.labels.clearLayers();
  if (view === "cap") {
    for (const f of CAPF) {
      const p = f.properties, est = p.kind === "estimated";
      groups.labels.addLayer(L.tooltip({permanent: true, direction: "center", className: "occ" + (est ? " est" : ""),
                                        interactive: false, offset: CAP_OFF[p.face] || [0, 0]})
        .setLatLng(midOf(f.geometry.coordinates)).setContent((est ? "≈ " : "") + nf(p.spaces)));
    }
    return;
  }
  if (view !== "occ") return;
  for (const f of LY.stretches.features) {
    const s = stretchStats(f.properties);
    if (!s || s.occ == null) continue;
    const c = f.geometry.coordinates, mid = c[Math.floor(c.length / 2)];
    groups.labels.addLayer(L.tooltip({permanent: true, direction: "center", className: "occ", interactive: false})
      .setLatLng([mid[1], mid[0]]).setContent(pct(cap1(s.occ))));
  }
}

function drawCars() {
  groups.cars.clearLayers(); groups.tracks.clearLayers();
  if (view === "cap") return;
  // the evening mean overlays the window passes, each footprint at 1 / (passes covering its
  // block) of full opacity: a spot parked whenever it was seen is darkest
  const ids = selIds(), over = (pass === "evening" && EV.length > 1) || (!!aggById[pass] && ids.length > 1);
  for (const f of LY.cars.features) {
    const p = f.properties;
    if (!ids.includes(p.clip)) continue;
    const poly = L.polygon(f.geometry.coordinates[0].map(c => [c[1], c[0]]),
      {color: "#fff", weight: over ? 0.5 : 1, fillColor: "#0b0b0b",
       fillOpacity: !over ? .75 : aggById[pass] ? 0.8 * (p.op?.[pass] ?? 1) : 0.8 / Math.max(1, p.n_cov || ids.length)});
    if (REVIEW) poly.bindTooltip(`${esc(passLabel(p.clip))} · ${esc(p.cls)} · ${p.length_m} m · ${p.x0}–${p.x1} m${p.flag ? " · " + esc(p.flag) : ""}`, {sticky: true});
    poly.addTo(groups.cars);
  }
  if (!REVIEW) return;
  for (const f of LY.tracks.features) {
    if (!ids.includes(f.properties.clip)) continue;
    L.polyline(lls(f), {color: "#6250d6", weight: 2, opacity: .7})
      .bindTooltip(`GPS track ${esc(passLabel(f.properties.clip))} (raw; evening DOP ~6 → biased laterally)`, {sticky: true})
      .addTo(groups.tracks);
  }
}

function zonePopup(p) {

  return `<b>${esc(p.text)}</b><br>${esc(kindLabel(p.kind))} · row ${p.row} · ` +
    `${p.x0}–${p.x1} m (${(p.x1 - p.x0).toFixed(0)} m)<br>source ${esc(p.source)}` +
    `${p.ref ? ", ref " + esc(p.ref) : ""}${p.inference ? ", extent: " + esc(p.inference.replaceAll("_", " ")) : ""}` +
    `<br>${act}${p.check ? `<br><b style="color:var(--critical)">Site check</b>` : ""}`;
}

function apply() {
  const z = map.getZoom(), want = new Set(["curb", "checks"]);
  for (const [k, , , vis] of TOG) if (shown[k] && (!vis || vis())) want.add(k);
  if (z < POINT_ZOOM) ["zones", "signs", "hydrants", "cars"].forEach(k => want.delete(k));
  if (z < (view === "cap" ? CAP_LABEL_ZOOM : LABEL_ZOOM)) want.delete("labels");
  for (const k of ["checks", "curb", "zones", "tracks", "cars", "hydrants", "signs", "labels"]) {

// ---- headline + tables
function streetOcc() {
  if (pass !== "evening" || aggById[pass]) {
    let n = 0, c = 0;
    let one = 0;
    for (const f of LY.stretches.features) {
      const s = stretchStats(f.properties);
      if (s && s.cap > 0 && s.parked != null) { n += s.parked; c += s.cap; one += !!oneSlot(s); }
    }
    return c ? {occ: n / c, n, c, one} : null;
  }
  // evening: the stretch means (curb covered by every evening pass), summed
  let n = 0, c = 0, k = 0;
  for (const f of LY.stretches.features) {
    const e = f.properties.evening;
    if (e) { n += e.parked; c += e.capacity; k = Math.max(k, e.n_passes); }
  }
  return c ? {occ: n / c, n, c, mean: k} : null;
}
function capTables() {
  const lv = pct(CAP.interval);
  document.getElementById("hero").textContent = "≈ " + nf(Math.round(CAP.total), 0);
  document.getElementById("herowhat").innerHTML = t("cap_what", lv, nf(Math.round(CAP.low), 0), nf(Math.round(CAP.high), 0),
    nf(CAP.measured.spaces), nf(CAP.measured.faces), nf(Math.round(CAP.estimated.spaces), 0), nf(CAP.estimated.faces));
  document.getElementById("h-table").textContent = t("streets");
  // one row per street and source: a street with both measured and estimated blocks gets two
  // rows, so the two figures never sit side by side as if they measured the same curb
  const st = {};
  for (const f of CAPF) {
    const p = f.properties, k = `${p.street}|${p.kind}`;
    const r = st[k] = st[k] || {street: p.street, kind: p.kind, order: p.order, n: 0, len: 0, fs: []};
    r.n += p.spaces; r.len += p.length_m; r.order = Math.min(r.order, p.order);
    r.fs.push(f);
  }
  const rows = Object.values(st).sort((a, b) => a.order - b.order || (a.kind === "measured" ? -1 : 1));
  const [c0, c1, c2, c3] = t("cap_cols");
  const sp = (kind, v) => (kind === "estimated" ? "≈ " : "") + nf(v, 0);
  const m = (k, f) => rows.filter(r => r.kind === k).reduce((a, r) => a + r[f], 0);
  const sub = (lab, len, txt) => `<tr><td>${esc(lab)}</td><td></td><td class="n">${nf(len, 0)} m</td><td class="p">${txt}</td></tr>`;
  document.getElementById("blocks").innerHTML =
    `<thead><tr><th>${esc(c0)}</th><th></th><th>${esc(c2)}</th><th>${esc(c3)}</th></tr></thead><tbody>` +
    rows.map((r, i) => `<tr data-i="${i}"><td>${esc(r.street)}</td><td class="src">${esc(t("src_" + r.kind))}</td>` +
      `<td class="n">${nf(r.len, 0)} m</td><td class="p">${sp(r.kind, r.n)}</td></tr>`).join("") +
    // subtotals and total: the area figures (unrounded estimates), as in the headline and the method
    `</tbody><tfoot>` + sub(t("sub_m"), m("measured", "len"), nf(CAP.measured.spaces, 0)) +
    sub(t("sub_e"), m("estimated", "len"), sp("estimated", Math.round(CAP.estimated.spaces))) +
    sub(t("total"), m("measured", "len") + m("estimated", "len"), sp("estimated", CAP.total)) + `</tfoot>`;
  document.querySelectorAll("#blocks tbody tr").forEach(tr => tr.addEventListener("click", () =>
    map.fitBounds(L.latLngBounds(rows[+tr.dataset.i].fs.flatMap(lls)).pad(0.15))));
}
function distBars() {
  const box = document.getElementById("dist"), h = document.getElementById("h-dist");
  const D = M.distribution || [];
  const on = view === "occ" && D.length > 0;
  box.style.display = h.style.display = on ? "" : "none";
  if (!on) return;
  h.textContent = t("dist");
  const ink = c => c.color === RAMP[0] ? "#0b0b0b" : "#fff";   // label inside a fill: by its luminance
  box.innerHTML = D.map(b => {
    const segs = CLASSES.filter(c => (b.shares[c.key] || 0) > 0).map(c => {
      const v = b.shares[c.key], tip = t("dist_seg", clsLabel(c), pct(v), b.units[c.key] || 0, b.n_units, b.weighted);
      return `<i style="flex:${v} 1 0;background:${c.color};color:${ink(c)}" title="${esc(tip)}" aria-label="${esc(tip)}">${v >= 0.12 ? pct(v) : ""}</i>`;
    }).join("");
    return `<div class="row"><div class="lab"><span>${esc(title(b.label))}</span><span class="n">${esc(t("dist_n", b.n_units, b.n_stretches, b.n_dates))}</span></div>` +
      `<div class="stk" role="img" aria-label="${esc(title(b.label))}">${segs}</div></div>`;
  }).join("") +
    `<div class="key">${CLASSES.map(c => `<span><b style="background:${c.color}"></b>${esc(clsLabel(c))}</span>`).join("")}</div>` +
    `<div class="note">${esc(distNote(D))}</div>`;
}
// Plain-language note under the bars: what a bar shows, one worked example (the bar marked
// `example` in the area config: its share below the "low" threshold), what time-weighted means.
function distNote(D) {
  let s = t("dist_note", G.stretch_spaces || "?");
  const ex = D.find(b => b.example), under = CLASSES.filter(c => c.hi != null && c.hi <= G.thresholds.low);
  if (ex && under.length) {
    const k = under.reduce((a, c) => a + (ex.units[c.key] || 0), 0);
    const p = ex.weighted ? under.reduce((a, c) => a + (ex.shares[c.key] || 0), 0) : k / ex.n_units;
    const names = under.slice().reverse().map(c => (t("cls")[c.key] || c.en).toLowerCase()).join(` ${t("or")} `);
    s += t("dist_example", title(ex.label), names, pct(G.thresholds.low), pct(p), k, ex.n_units);
  }
  if (D.some(b => b.weighted)) {
    const w = (G.slots || []).map(x => x.weight);
    s += t("dist_weighted", w.length, w.every(x => Math.abs(x - w[0]) < 1e-9));
  }
  return s;
}

// ---- method
function regsText(r) {
  const names = (l) => l.length <= 2 ? l.map(esc).join(` ${t("and")} `) : t("n_streets", l.length);
  const how = [];
  if (r.convention.length) how.push(t("regs_conv", names(r.convention)));
  if (r.inferred.length) how.push(t("regs_inf", r.convention.length && r.inferred.length > 2
                                                ? t("other_streets", r.inferred.length) : names(r.inferred)));
  const fix = [r.arrows && t("regs_arrows", r.arrows), r.dropped && t("regs_dropped", r.dropped),
               r.moved && t("regs_moved", r.moved)].filter(Boolean);
  return {how: how.join("; "), fix: fix.length ? t("regs_fix", fix.join(", ")) : ""};
}
function method() {
  const pr = M.prior, ref = REF ? `<a href="${esc(REF.url)}" target="_blank" rel="noopener">${esc(REF.title)}</a>` : esc(G.profile);
  const k = CAP;
  document.getElementById("method").innerHTML =
    t("m_occ", {ss: G.stretch_spaces || "?", area: !!M.area, ref, stall: nf(G.stall_m)}) +
    t("m_counts", {area: !!M.area, nst: M.area ? M.area.streets.length : 0, np: M.passes.length, ne: EVS ? EVS.length : 0,
                   frame: frame(), w0: G.window[0], w1: G.window[1], hasref: !!REF, slots: AGG.length > 0}) +
    (AGG.length ? t("m_slots", {n: AGG.length - 1,
                                list: AGG.filter(a => a.kind === "slot").map(a => `${slotLabel(a.slot).toLowerCase()} (${hrs(a.hours)})`).join(", "),
                                w: AGG.filter(a => a.kind === "slot").map(a => `${slotLabel(a.slot).toLowerCase()} ${pct(a.weight)}`).join(", ")}) : "") +
    (pr ? t("m_prior", {corner: pr.corner_m, ni: pr.n_ignored,
                        keep: pr.keep?.length ? " (" + pr.keep.map(q => esc(q.note || "exception")).join(", ") + ")" : ""}) : "") +
    (M.regs && !pr ? t("m_regs", regsText(M.regs)) : "") +
    t("m_spaces", {stall: nf(G.stall_m)}) +
    t("m_classes", {cls: CLASSES.map(c => esc(clsLabel(c))).join(" · "), hasref: !!REF,
                    opt: pct(G.thresholds.optimal), low: pct(G.thresholds.low)}) +
    (k ? t("m_cap", {stall: nf(G.stall_m), rate: nf(k.rate_per_km), mps: nf(k.m_per_space), n: nf(k.sample.faces),
                     sp: nf(k.sample.spaces), len: nf(k.sample.length_m), cv: pct(k.sample.rate_cv), lv: pct(k.interval),
                     lo: nf(Math.round(k.low), 0), hi: nf(Math.round(k.high), 0), note: " " + esc(title(k.note) || ""),
                     restr: k.estimated.restricted_m ? t("m_restr", nf(k.estimated.faces_restricted), nf(k.estimated.restricted_m)) : ""}) : "");
}

// ---- page chrome (everything that changes with the language)
function chrome() {
  document.documentElement.lang = LANG;
  const name = title(M.street) || M.name;
  document.title = name;
  document.getElementById("title").textContent = name;
  document.getElementById("subtitle").textContent = REVIEW ? t("review") : t(CAPF.length ? "subtitle" : "subtitle_street", frame());
  document.getElementById("gen").textContent = t("generated", M.generated.replace("T", " "));
  document.getElementById("attr").innerHTML = t("attr",
    (M.attribution || []).map(a => a[LANG] || a.en).join(" "));
  for (const k of ["legend", "layers", "method"]) document.getElementById("h-" + k).textContent = t(k);
  const ev = M.occupancy && M.occupancy.evening, warns = [];
  if (REVIEW && ev && ev.meets_n_evenings === false)   // public page: no notice (user, 2026-10-30)
    warns.push(t("provisional", ev.n_dates, G.n_evenings));
  if (!M.driveways_labelled) warns.push(t("no_driveways"));
  document.getElementById("warn").innerHTML = warns.map(w => `<div class="warn">${esc(w)}</div>`).join("");
}
function render() { chrome(); fillLangs(); fillViews(); fillBases(); fillToggles(); fillPasses(); method(); redraw(); }

// ---- site checks (review)
const card = document.getElementById("card");
function openCard(d) {
  map.fitBounds(L.latLngBounds([d.pole ? [d.pole.lat, d.pole.lon] : M.center,
    ...LY.zones.features.filter(f => f.properties.check === d.ref).flatMap(lls)]).pad(0.6));
  const zrows = d.zones.map(z => `<tr><td>Zone ${z.x0}–${z.x1} m</td><td>${z.length_m} m, ${esc(z.kind)}, extent ${esc(z.inference.replaceAll("_", " ") || "–")}; ` +
    Object.entries(z.active || {}).map(([c, a]) => `${esc(passLabel(c))}: ${a == null ? "?" : a ? "in force" : "not in force"}, ` +
      `${z.cars_inside[c]} inside`).join("; ") + `</td></tr>`).join("");
  const sf = LY.signs.features.find(f => f.properties.pole === d.ref);
  const panels = sf ? sf.properties.panels.map(q => `${esc(q.text)} <span style="color:var(--muted)">(${esc(q.code)}, arrow ${q.arrow}, installed ${esc(q.installed)})</span>`).join("<br>") : "–";
  const crops = (d.crops || []).map(c => `<figure><div class="scroll"><a href="${c.src}" target="_blank"><img src="${c.src}" alt="Mosaic, ${esc(passLabel(c.pass))}"></a></div>` +
    `<figcaption>Mosaic, ${esc(passLabel(c.pass))}. Ruler = street-axis metres; red lines = zone ends / pole.</figcaption></figure>`).join("");
  const frames = (d.frames || []).map(c => `<figure><a href="${c.src}" target="_blank"><img class="frame" src="${c.src}" alt="Raw frame toward pole ${esc(d.ref)}"></a>` +
    `<figcaption>Raw frame, ${esc(passLabel(c.pass))}, t = ${c.t} s, bike at ${c.bike_x} m (pole at ${d.pole.x.toFixed(0)} m).</figcaption></figure>`).join("");
  card.innerHTML = `<header><h3>${d.check} · row ${esc(d.row)} · ${d.x0.toFixed(0)}–${d.x1.toFixed(0)} m<br>` +
    `<span class="sub">${esc(d.text)} · ${esc(d.why.join("; "))}</span></h3>` +
    (d.streetview ? `<a class="btn" href="${d.streetview}" target="_blank" rel="noopener">Street View ↗</a>` : "") +
    `<button class="btn" onclick="card.close()">Close</button></header><div class="body">` +
    `<table><tr><td>Pole</td><td>${esc(d.ref)} (${esc(d.source)})</td></tr>` +
    `<tr><td>Panels</td><td>${panels}</td></tr>${zrows}</table>` +
    `<div class="imgs">${crops || '<p class="sub">No mosaic crop.</p>'}` +
    `${frames || '<p class="sub">No raw frame: no pass has this pole on the camera side.</p>'}</div></div>`;
  card.showModal();
}
if (REVIEW) {
  const box = document.getElementById("checkbox");
  box.innerHTML = `<h2>Site checks (${D.checks.length})</h2><div class="sub" style="margin-bottom:8px">Sign poles to photograph:
    a no-stopping or reserved zone with vehicles parked inside on some pass (kept as signed: conservative), or a
    mid-block panel the regulation prior did not apply.</div><ul class="dl" id="checks"></ul>`;
  const ul = document.getElementById("checks");
  for (const d of D.checks) {
    const li = document.createElement("li");
    li.innerHTML = `<div><span class="id">${d.check}</span> row ${esc(d.row)} · ${d.x0.toFixed(0)}–${d.x1.toFixed(0)} m</div>` +
      `<div class="t">${esc(d.text)} · pole ${esc(d.ref)} · ${esc(d.why.join("; "))} · vehicles inside per pass: ${Object.values(d.cars_inside).join(" / ")}</div>`;
    li.addEventListener("click", () => openCard(d));
    ul.appendChild(li);
  }
  if (!D.checks.length) ul.innerHTML = `<li class="t">None.</li>`;
}

drawRegs(); render();
map.on("zoomend", apply);
// view in the URL hash (#zoom/lat/lon): bookmarkable positions
const h = location.hash.slice(1).split("/").map(Number);
if (h.length === 3 && h.every(Number.isFinite)) map.setView([h[1], h[2]], h[0], {animate: false});
else {
  const all = [...LY.status.features, ...CAPF].flatMap(lls);
  if (all.length) map.fitBounds(L.latLngBounds(all), {padding: [20, 20], animate: false});
}
apply();
map.on("moveend", () => {
  const c = map.getCenter();
  history.replaceState(null, "", `${location.search}#${map.getZoom()}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`);
});
</script>
</body>
</html>
