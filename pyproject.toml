[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curb-occupancy"
version = "0.1.0"
description = "On-street parking occupancy from bike-mounted GoPro footage (pushbroom mosaics + detection)"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []  # pinned in requirements.lock.txt (installed by `make env`)

[project.scripts]
curb-occupancy = "curb_occupancy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curb_occupancy = ["publish/*.html", "rigs/*/*.yaml", "rigs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
